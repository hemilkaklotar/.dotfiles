"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

format = """
$directory\
$git_branch\
$git_status\
$fill\
$c\
$elixir\
$elm\
$golang\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
$conda\
$python\
$time\n  \
[󱞪](fg:iris) \
"""


[palettes.catppuccin-mocha]
overlay = '#313244'
love = '#f38ba8'
gold = '#f9e2af'
rose = '#f5e0dc'
pine = '#89b4fa'
foam = '#94e2d5'
iris = '#cba6f7'

[directory]
format = "[ $path ]($style) "
style = "fg:pine"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
Documents = "󰈙"
Downloads = " "
Music = " "
Pictures = " "

[fill]
style = "fg:overlay"
symbol = " "

[git_branch]
format = "[ $symbol $branch ]($style) "
style = "fg:foam"
symbol = ""

[git_status]
disabled = false
style = "fg:love"
format = '[$all_status$ahead_behind]($style) '
up_to_date = '[ ✓ ](fg:iris)'
untracked = '[?\($count\)](fg:gold)'
stashed = '[\$](fg:iris)'
modified = '[!\($count\)](fg:gold)'
renamed = '[»\($count\)](fg:iris)'
deleted = '[✘\($count\)](style)'
staged = '[++\($count\)](fg:gold)'
ahead = '[⇡\(${count}\)](fg:foam)'
diverged = '⇕[\[](fg:iris)[⇡\(${ahead_count}\)](fg:foam)[⇣\(${behind_count}\)](fg:rose)[\]](fg:iris)'
behind = '[⇣\(${count}\)](fg:rose)'

[time]
disabled = false
format = " [$time 󰴈 ]($style)"
style = "fg:rose"
time_format = "%I:%M%P"
use_12hr = true



# Languages

[c]
style = "fg:pine"
format = " [$symbol$version]($style)"
disabled = false
symbol = " "

[elixir]
style = "fg:pine"
format = " [$symbol$version]($style)"
disabled = false
symbol = " "

[elm]
style = "fg:pine"
format = " [$symbol$version]($style)"
disabled = false
symbol = " "

[golang]
style = "fg:pine"
format = " [$symbol$version]($style)"
disabled = false
symbol = " "

[haskell]
style = "fg:pine"
format = " [$symbol$version]($style)"
disabled = false
symbol = " "

[java]
style = "fg:pine"
format = " [$symbol$version]($style)"
disabled = false
symbol = " "

[julia]
style = "fg:pine"
format = " [$symbol$version]($style)"
disabled = false
symbol = " "

[nodejs]
style = "fg:pine"
format = " [$symbol$version]($style)"
disabled = false
symbol = "󰎙 "

[nim]
style = "fg:pine"
format = " [$symbol$version]($style)"
disabled = false
symbol = "󰆥 "

[rust]
style = "fg:pine"
format = " [$symbol$version]($style)"
disabled = false
symbol = " "

[scala]
style = "fg:pine"
format = " [$symbol$version]($style)"
disabled = false
symbol = " "

[python]
style = "fg:pine"
format = " [$symbol$version]($style)"
disabled = false
symbol = ' '

[conda]
style = "fg:pine"
format = " [$symbol$environment]($style)"
disabled = false
symbol = '🅒 '

