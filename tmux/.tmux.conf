# =============================================================================
# tmux — modern, powerful, standard keybinds
# prefix: C-a  (screen-style, 2nd most popular after C-b; easy + doesn't
#               fight vim). C-b is unbound. All default keys are KEPT —
#               we only override/add (never `unbind -a`).
# cheatsheet: see README.md  | reload: <prefix> r
# =============================================================================

# ---------- terminal / modern features ----------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"                    # truecolor
set -ga terminal-overrides ",*:Smulx=\E[4::%p1%dm"    # undercurl
set -ga terminal-overrides ",*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m"
set -g focus-events on
set -g extended-keys on
set -gq allow-passthrough on
set -s set-clipboard on                               # system clipboard
set -g mouse on

# ---------- general behaviour (sensible baseline, also in a plugin) ----------
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 100000
set -g display-time 2000
set -g display-panes-time 2000
set -g status-interval 5
set -g aggressive-resize on
# server env may predate ~/.local/bin (sesh, pickers) — ensure it for run-shell/new panes
set-environment -g PATH "$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin"
set -g set-titles on                  # terminal title = session name (Ghostty tab)
set -g set-titles-string '#S'
set -g clock-mode-style 24
set -g mode-keys vi
set -g status-keys vi
set -g monitor-activity on
set -g visual-activity off
set -g bell-action any

# ---------- prefix ----------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# =============================================================================
# KEYBINDS — community-standard layout
# =============================================================================

# -- utility --
bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'
bind : command-prompt
bind C-l send-keys 'clear' \; send-keys Enter

# -- panes: | vertical, - horizontal (the universal standard) --
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
# vim-style aliases many configs add (kept, harmless)
bind v split-window -h -c '#{pane_current_path}'
bind s split-window -v -c '#{pane_current_path}'

# vim focus (repeatable) + Alt-hjkl without prefix
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# resize (repeatable, 5 cells; Alt+Shift variant = 2-cell fine-tune)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -n M-H resize-pane -L 2
bind -n M-J resize-pane -D 2
bind -n M-K resize-pane -U 2
bind -n M-L resize-pane -R 2

# pane management (standard keys)
bind z resize-pane -Z
bind x confirm-before -p 'close pane #P? (y/n)' kill-pane
bind ! break-pane -d
bind b break-pane -d
bind G command-prompt -p 'join pane from:' 'join-pane -s %%'
bind -r \{ swap-pane -U
bind -r \} swap-pane -D
bind Space next-layout
# prefix + / belongs to copycat (regex search below); display-panes lives on prefix + q

# -- windows: c/n/p/w/,/& + 1-9 (defaults everyone knows) --
bind c new-window -c '#{pane_current_path}'
bind n next-window
bind p previous-window
bind Tab last-window
bind w choose-window
bind , command-prompt -p 'rename window:' 'rename-window -- %%'
bind & confirm-before -p 'close window #W? (y/n)' kill-window
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1
# no-prefix window switching (very popular): Shift+Left/Right, Alt+n/p
bind -n S-Left previous-window
bind -n S-Right next-window
bind -n M-n next-window
bind -n M-p previous-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# -- sessions (sesh: smart session manager, tmux + configs + zoxide) --
bind d detach-client
bind D choose-client
bind $ command-prompt -p 'rename session:' 'rename-session -- %%'
bind \( switch-client -p
bind \) switch-client -n
bind S choose-tree -sZ -O name
# sesh full picker: all / tmux / configs / zoxide / kill / find
bind-key T run-shell "$HOME/.local/bin/sesh connect \"$($HOME/.local/bin/sesh list --icons | fzf-tmux -p 80%,70% --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' --header '  ^a all ^t tmux ^g configs ^x zoxide ^d kill ^f find' --bind 'tab:down,btab:up' --bind 'ctrl-a:change-prompt(⚡  )+reload($HOME/.local/bin/sesh list --icons)' --bind 'ctrl-t:change-prompt(🪟  )+reload($HOME/.local/bin/sesh list -t --icons)' --bind 'ctrl-g:change-prompt(⚙️  )+reload($HOME/.local/bin/sesh list -c --icons)' --bind 'ctrl-x:change-prompt(📁  )+reload($HOME/.local/bin/sesh list -z --icons)' --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload($HOME/.local/bin/sesh list --icons)')\""
# sesh quick picker (replaces old tmux-sessionizer)
bind f run-shell "$HOME/.local/bin/sesh connect \"$($HOME/.local/bin/sesh list --icons | fzf-tmux -p 75%,70% --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ')\""
# last session via sesh (overrides default last-session)
bind -N "last-session (via sesh)" L run-shell "$HOME/.local/bin/sesh last"

# -- copy mode (vi, yank-friendly) --
bind [ copy-mode
bind ] paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line
bind -T copy-mode-vi / send-keys -X search-forward
bind -T copy-mode-vi ? send-keys -X search-backward

# -- productivity popups --
# cht.sh cheatsheet (wires up your ~/.tmux-cht-languages + ~/.tmux-cht-command)
bind i display-popup -E -w 80% -h 80% "$HOME/.local/bin/tmux-cht.sh"
# lazygit / shell scratchpad via floax (prefix p, see plugin opts below)
# sesh session picker lives on prefix T (full) and prefix f (quick)

# toggle synchronized panes (broadcast input) — off by default, shown in status
bind Y setw synchronize-panes \; display-message 'synchronize-panes #{?pane_synchronized,on,off}'

# =============================================================================
# PLUGINS — lean productivity set
#   kept:    tpm, vim-tmux-navigator, yank, resurrect, continuum, floax
#   removed: sainnhe/tmux-fzf (overlaps sesh, unmaintained),
#            alexwforsythe/tmux-which-key (prefix input lag),
#            omerxx/tmux-sessionx (replaced by sesh binary + prefix T/f)
#   added:   sensible (community baseline), open (o/O open URLs & files),
#            copycat (/, Ctrl-f, Ctrl-g regex search, pairs with yank)
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-floax'

# -- sensible: nothing to configure, it follows mode-keys/vi automatically --

# -- yank: stay in copy mode off, mouse selection auto-copies --
set -g @yank_action 'copy-pipe'
set -g @yank_selection_mouse 'clipboard'

# -- open: o is owned by sessionx, so open lives on O (C-o opens in $EDITOR) --
set -g @open 'O'

# -- copycat: M-h stays pane-nav, so hash search moves to M-g --
set -g @copycat_hash_search 'M-g'

# -- resurrect + continuum: auto-save every 5 min, auto-restore on boot --
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'

# event-driven saves (complements the 5-min timer — always fresh on detach/launch)
set-hook -g client-detached 'run-shell $HOME/.tmux/plugins/tmux-resurrect/scripts/save.sh'
set-hook -g session-created 'run-shell $HOME/.tmux/plugins/tmux-resurrect/scripts/save.sh'
set-hook -g window-linked 'run-shell $HOME/.tmux/plugins/tmux-resurrect/scripts/save.sh'
set-hook -g window-unlinked 'run-shell $HOME/.tmux/plugins/tmux-resurrect/scripts/save.sh'

# -- floax: floating scratchpad terminal --
set -g @floax-bind 'p'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-change-path 'true'

# TPM bootstrap is at the very bottom of this file (required: plugins rewrite
# status-right interpolation like #{continuum_status} at load time).

# =============================================================================
# THEME — modern status, your Noctalia palette
# Generated palette (if present) provides @noctalia_* vars; we fall back
# gracefully when Noctalia hasn't generated it.
# =============================================================================

set -g status-position top
set -g status-justify absolute-centre
set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 90
set -g status-style 'bg=#1b1b1b,fg=#e2e2e2'

# left: session pill + flags (adjacent conditionals — no nesting, no commas
# inside branches, so tmux always parses this correctly)
set -g status-left '#[bg=#b2c5ff,fg=#002b73,bold] #S #[bg=#1b1b1b]#{?client_prefix,#[fg=#ffdad6 bold] PREFIX ,}#{?pane_synchronized,#[fg=#fed7f9 bold] SYNC ,}#[fg=#919191] #{pane_current_command} '

# right: auto-save state + date/time
set -g status-right '#[fg=#919191]#{continuum_status} %a %d %b #[fg=#e2e2e2,bold]%H:%M '

# windows: pill tabs, active = filled, bell/activity tinted (#F = flags)
set -g window-status-separator ''
set -g window-status-style 'fg=#c6c6c6'
set -g window-status-format ' #I:#W#F '
set -g window-status-current-style 'bg=#b2c5ff,fg=#002b73,bold'
set -g window-status-current-format ' #I:#W#{?window_zoomed_flag,+,}#F '
set -g window-status-last-style 'fg=#e2e2e2,bold'
set -g window-status-activity-style 'bg=#5a3d59,fg=#fed7f9'
set -g window-status-bell-style 'bg=#93000a,fg=#ffdad6,bold'

# panes / messages: quiet dividers, clear focus, rounded popups
set -g pane-border-style 'fg=#474747'
set -g pane-active-border-style 'fg=#b2c5ff'
set -g pane-border-lines heavy
set -g message-style 'bg=#1f428f,fg=#dae2ff'
set -g message-command-style 'bg=#1f428f,fg=#dae2ff'
set -g mode-style 'bg=#404659,fg=#dce2f9,bold'
set -g popup-border-lines double
set -g popup-style 'bg=#131313,fg=#e2e2e2'
set -g popup-border-style 'fg=#919191'
set -g menu-style 'bg=#2a2a2a,fg=#e2e2e2'
set -g menu-selected-style 'bg=#b2c5ff,fg=#002b73,bold'
set -g display-panes-active-colour '#b2c5ff'
set -g display-panes-colour '#919191'
set -g clock-mode-colour '#b2c5ff'

# =============================================================================
# TPM — plugin manager (KEEP AT THE VERY BOTTOM)
# manage: <prefix> I install · <prefix> U update · <prefix> Alt-u uninstall
# =============================================================================
run '~/.tmux/plugins/tpm/tpm'

# Post-plugin overrides (plugins load above; our choices win down here).
set -g status-keys vi   # sensible forces emacs; we use vi everywhere
# Modern rounded top bar — uses #{@noctalia_*} vars, so it re-themes live
# whenever Noctalia regenerates themes/noctalia.conf. Keep LAST.
source-file -q "$HOME/.config/tmux/themes/noctalia.conf"
source-file -q "$HOME/.config/tmux/themes/noctalia-topbar.conf"
