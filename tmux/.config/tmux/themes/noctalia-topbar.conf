# noctalia-topbar — modern rounded top bar for tmux, follows the Noctalia palette.
#
# Sourced AFTER themes/noctalia.conf (see bottom of ~/.tmux.conf).
# Every colour references #{@noctalia_*} vars *dynamically*, so when Noctalia
# regenerates the palette (`noctalia msg templates-apply`, whose post-hook
# re-sources themes/noctalia.conf into running servers) this bar re-themes
# live with no extra hook.
#
# Requires a Nerd Font for the rounded   caps (you have them).

set -g status-position top
# 'centre' (not absolute-centre): window list centres in the space between
# left and right sections, so the three never draw over each other.
set -g status-justify centre
set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 90

# Base bar — transparent so only the pills show.
set -gqF status-style "bg=default,fg=#{@noctalia_on_surface}"

# Left: session pill (primary) + PREFIX / SYNC indicators + active command.
# NOTE: tmux splits #{?...} branches on commas, so style spans inside
# conditionals must not contain commas — attributes are stacked instead.
set -g status-left '#[fg=#{@noctalia_primary},bg=default]#[bg=#{@noctalia_primary},fg=#{@noctalia_on_primary},bold]  #S #[fg=#{@noctalia_primary},bg=default]#{?client_prefix,#[fg=#{@noctalia_error_container}]#[bg=default] #[bg=#{@noctalia_error_container}]#[fg=#{@noctalia_on_error_container}]#[bold] PREFIX #[fg=#{@noctalia_error_container}]#[bg=default],}#{?pane_synchronized,#[fg=#{@noctalia_tertiary_container}]#[bg=default] #[bg=#{@noctalia_tertiary_container}]#[fg=#{@noctalia_on_tertiary_container}]#[bold] SYNC #[fg=#{@noctalia_tertiary_container}]#[bg=default],} #[fg=#{@noctalia_on_surface_variant}]#{pane_current_command} '

# Windows: rounded pills — inactive muted, active filled with primary.
set -g window-status-separator ' '
set -g window-status-format '#[fg=#{@noctalia_surface_container},bg=default]#[bg=#{@noctalia_surface_container},fg=#{@noctalia_on_surface_variant}] #I:#W#F #[fg=#{@noctalia_surface_container},bg=default]'
set -g window-status-current-format '#[fg=#{@noctalia_primary},bg=default]#[bg=#{@noctalia_primary},fg=#{@noctalia_on_primary},bold] #I:#W#F #[fg=#{@noctalia_primary},bg=default]'

# Right: autosave state + date + clock pill.
set -g status-right '#[fg=#{@noctalia_on_surface_variant}]#{continuum_status} %a %d %b #[fg=#{@noctalia_primary_container},bg=default]#[bg=#{@noctalia_primary_container},fg=#{@noctalia_on_primary_container},bold] %H:%M #[fg=#{@noctalia_primary_container},bg=default] '
